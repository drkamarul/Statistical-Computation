project:
  type: default
  output-dir: _site
  render:
    - index.qmd

bibliography: references.bib

format:
  revealjs:
    theme: [default, styles/academic.scss]
    slide-number: c/t
    show-slide-number: all
    progress: true
    history: true
    width: 1280
    height: 720
    margin: 0.07
    center: false
    incremental: false
    link-external-newwindow: true
    code-line-numbers: false
    highlight-style: github
    embed-resources: false
